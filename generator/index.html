<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+Thai:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #171310;
    --panel: #211B16;
    --plate: #2B2119;
    --line: #3A2E22;
    --ember: #FF7A33;
    --ember-dim: #B4551A;
    --spark: #FFD166;
    --steel: #E8E1D6;
    --steel-dim: #9C9184;
    --danger: #FF5A5F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    background-image: radial-gradient(ellipse at 50% -10%, rgba(255, 122, 51, 0.08), transparent 60%);
    color: var(--steel);
    font-family: "Noto Sans Thai", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 56px 20px 40px;
  }

  .hero {
    text-align: center;
    margin-bottom: 28px;
  }

  .hero h1 {
    font-family: "Chakra Petch", sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.01em;
    margin: 0 0 8px;
  }

  .hero p {
    margin: 0;
    color: var(--steel-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .topbar {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 24px;
    font-size: 13px;
  }

  .topbar-current {
    color: var(--steel-dim);
    font-weight: 600;
  }

  .topbar-link {
    color: var(--ember);
    font-weight: 600;
    text-decoration: none;
  }

  .topbar-link:hover {
    text-decoration: underline;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 26px 24px 24px;
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.75);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13px;
    color: var(--steel-dim);
    margin-bottom: 16px;
  }

  .row input[type="range"] {
    flex: 1;
    accent-color: var(--ember);
    height: 4px;
  }

  .row input[type="range"]::-webkit-slider-thumb {
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }

  .length-value {
    font-family: "IBM Plex Mono", monospace;
    color: var(--steel);
    width: 24px;
    text-align: right;
  }

  .switches {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  .switch {
    flex: 1;
    min-width: 70px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--plate);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    cursor: pointer;
    color: var(--steel-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
  }

  .switch-track {
    position: relative;
    width: 26px;
    height: 14px;
    border-radius: 999px;
    background: var(--line);
    flex-shrink: 0;
    transition: background 0.15s ease;
  }

  .switch-knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--steel-dim);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .switch[aria-pressed="true"] {
    color: var(--ember);
    border-color: var(--ember-dim);
  }

  .switch[aria-pressed="true"] .switch-track {
    background: var(--ember-dim);
  }

  .switch[aria-pressed="true"] .switch-knob {
    background: var(--ember);
    transform: translateX(12px);
  }

  .plate-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .plate {
    background: var(--plate);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 16px;
    min-height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1px;
    box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), inset 0 -1px 0 rgba(255, 255, 255, 0.03);
    font-family: "IBM Plex Mono", monospace;
    font-size: 18px;
    letter-spacing: 0.03em;
  }

  .plate .placeholder {
    color: var(--steel-dim);
    font-family: "Noto Sans Thai", sans-serif;
    font-size: 14px;
  }

  .plate .char {
    color: var(--spark);
    display: inline-block;
    animation: stamp 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.3) backwards;
  }

  @keyframes stamp {
    0% { opacity: 0; transform: scale(1.7); text-shadow: 0 0 12px var(--ember); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1); text-shadow: 0 0 0 transparent; }
  }

  @media (prefers-reduced-motion: reduce) {
    .plate .char { animation: none; }
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn-forge {
    width: 100%;
    background: var(--ember);
    border: none;
    border-radius: 10px;
    color: #241000;
    font-family: "Chakra Petch", sans-serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.03em;
    padding: 13px;
    cursor: pointer;
  }

  .btn-forge:hover { filter: brightness(1.08); }
  .btn-forge:active { transform: translateY(1px); }

  .btn-copy {
    width: 100%;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--steel-dim);
    font-family: inherit;
    font-size: 14px;
    padding: 10px;
    cursor: pointer;
  }

  .btn-copy:hover {
    color: var(--steel);
    border-color: var(--steel-dim);
  }

  .warning {
    text-align: center;
    font-size: 12px;
    color: var(--danger);
    min-height: 16px;
    margin-top: 10px;
  }

  .no-store {
    text-align: center;
    font-size: 12px;
    color: var(--steel-dim);
    margin-top: 20px;
  }

  input:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--ember);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="page">
    <nav class="topbar">
      <a class="topbar-link" href="../">ตรวจสอบ</a>
      <span class="topbar-current">สุ่มรหัสผ่าน</span>
    </nav>

    <header class="hero">
      <h1>รหัสผ่านใหม่ จากเตาหลอม</h1>
      <p>ตั้งค่าแล้วตี ได้รหัสผ่านสุ่มที่ปลอดภัยทันที</p>
    </header>

    <div class="panel">
      <div class="row">
        <span>ความยาว</span>
        <input id="GenLength" type="range" min="8" max="64" value="20">
        <span id="LengthValue" class="length-value">20</span>
      </div>

      <div class="switches">
        <button class="switch" type="button" data-charset="upper" aria-pressed="true">
          <span class="switch-track"><span class="switch-knob"></span></span>A-Z
        </button>
        <button class="switch" type="button" data-charset="lower" aria-pressed="true">
          <span class="switch-track"><span class="switch-knob"></span></span>a-z
        </button>
        <button class="switch" type="button" data-charset="digits" aria-pressed="true">
          <span class="switch-track"><span class="switch-knob"></span></span>0-9
        </button>
        <button class="switch" type="button" data-charset="symbols" aria-pressed="true">
          <span class="switch-track"><span class="switch-knob"></span></span>#$%
        </button>
      </div>

      <div class="plate-wrap">
        <div id="Plate" class="plate"><span class="placeholder">กดตีเพื่อเริ่ม</span></div>
      </div>

      <div class="actions">
        <button id="ForgeButton" class="btn-forge" type="button">ตี!</button>
        <button id="CopyButton" class="btn-copy" type="button">คัดลอก</button>
      </div>

      <div id="Warning" class="warning"></div>

      <p class="no-store">ไม่ถูกบันทึกหรือส่งไปไหน — ประมวลผลใน JavaScript บนเครื่องคุณเท่านั้น</p>
    </div>
  </div>

  <script src="../generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
