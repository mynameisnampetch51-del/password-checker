<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Amber Hearth, same tokens as the checker: near-black ground, #222 hairlines, one orange.
     The generated password is the data, so it takes the warm peach; the one filled control is Start. */
  :root {
    --bg: #111111;
    --card: #161616;
    --raised: #1C1C1C;
    --border: #222222;
    --ink: #EDEDED;
    --ink-dim: #888888;
    --ring: #E78A53;
    --peach: #FBCB97;
    --teal: #5F8787;
    --on-ring: #111111;
    --danger: #E78A53;
    --body: "Anuphan", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 12px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.6;
    padding: 32px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  .page { max-width: 960px; margin: 0 auto; }

  .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
  h1 { font-size: clamp(22px, 4vw, 28px); font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; margin: 0; }
  .lede { margin: 8px 0 0; max-width: 60ch; color: var(--ink-dim); }

  .tabs { display: inline-flex; padding: 4px; gap: 2px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .tabs a, .tabs span { padding: 7px 16px; border-radius: 7px; font-size: 14px; font-weight: 500; color: var(--ink-dim); }
  .tabs a:hover { color: var(--ink); }
  .tabs [aria-current="page"] { background: var(--raised); color: var(--ink); }

  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; margin-top: 28px; align-items: stretch; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; min-width: 0; display: flex; flex-direction: column; }
  .cap { display: block; margin: 0 0 12px; font-size: 13px; font-weight: 500; color: var(--ink-dim); }

  /* length */
  .row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .row input[type="range"] { flex: 1; accent-color: var(--ring); height: 4px; }
  .length-value { font-family: var(--mono); font-size: 20px; font-weight: 500; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }

  /* character-set switches */
  .switches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .switch {
    display: flex; align-items: center; gap: 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 11px 14px; cursor: pointer; color: var(--ink-dim);
    font-family: var(--mono); font-size: 14px; text-align: left;
  }
  .switch:hover { border-color: var(--ink-dim); }
  .switch-track { position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--border); flex-shrink: 0; transition: background 0.15s ease; }
  .switch-knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink-dim); transition: transform 0.15s ease, background 0.15s ease; }
  .switch[aria-pressed="true"] { color: var(--ink); border-color: var(--ring); }
  .switch[aria-pressed="true"] .switch-track { background: rgba(231, 138, 83, 0.35); }
  .switch[aria-pressed="true"] .switch-knob { background: var(--ring); transform: translateX(12px); }

  /* result */
  .plate {
    flex: 1; min-height: 140px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px 16px; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 1px;
    font-family: var(--mono); font-size: 22px; letter-spacing: 0.03em; overflow-wrap: anywhere; text-align: center;
  }
  .plate .placeholder { color: var(--ink-dim); font-family: var(--body); font-size: 14px; letter-spacing: 0; }
  .plate .char { color: var(--peach); display: inline-block; animation: stamp 0.22s cubic-bezier(0.2, 0.8, 0.3, 1.3) backwards; }
  @keyframes stamp {
    0% { opacity: 0; transform: scale(1.6); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) { .plate .char { animation: none; } }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .btn-start { flex: 2; background: var(--ring); border: 0; border-radius: 9px; color: var(--on-ring); font-weight: 700; font-size: 16px; padding: 12px; cursor: pointer; }
  .btn-start:hover { filter: brightness(1.08); }
  .btn-start:active { transform: translateY(1px); }
  .btn-copy { flex: 1; background: var(--raised); border: 1px solid var(--border); border-radius: 9px; color: var(--ink); font-size: 14px; font-weight: 500; padding: 12px; cursor: pointer; }
  .btn-copy:hover { border-color: var(--ink-dim); }

  .warning { font-size: 13px; color: var(--danger); min-height: 20px; margin-top: 10px; }

  .foot { margin-top: 28px; font-size: 13px; color: var(--ink-dim); display: flex; flex-wrap: wrap; gap: 4px 24px; font-family: var(--mono); }

  @media (max-width: 760px) {
    .desk { grid-template-columns: 1fr; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
  <div class="page">
    <header>
      <div class="top">
        <h1>รหัสผ่านใหม่ที่ปลอดภัย</h1>
        <nav class="tabs" aria-label="เครื่องมือ">
          <a href="../">ตรวจสอบ</a>
          <span aria-current="page">สุ่มรหัสผ่าน</span>
        </nav>
      </div>
      <p class="lede">ตั้งค่าแล้วเริ่ม ได้รหัสผ่านสุ่มที่ปลอดภัยทันที</p>
    </header>

    <div class="desk">
      <section class="card" aria-label="ตั้งค่า">
        <span class="cap">ความยาว</span>
        <div class="row">
          <input id="GenLength" type="range" min="8" max="64" value="20" aria-label="ความยาวรหัสผ่าน">
          <span id="LengthValue" class="length-value">20</span>
        </div>

        <span class="cap">ชุดตัวอักษร</span>
        <div class="switches">
          <button class="switch" type="button" data-charset="upper" aria-pressed="true">
            <span class="switch-track"><span class="switch-knob"></span></span>A-Z
          </button>
          <button class="switch" type="button" data-charset="lower" aria-pressed="true">
            <span class="switch-track"><span class="switch-knob"></span></span>a-z
          </button>
          <button class="switch" type="button" data-charset="digits" aria-pressed="true">
            <span class="switch-track"><span class="switch-knob"></span></span>0-9
          </button>
          <button class="switch" type="button" data-charset="symbols" aria-pressed="true">
            <span class="switch-track"><span class="switch-knob"></span></span>#$%
          </button>
        </div>
      </section>

      <section class="card" aria-label="ผลลัพธ์">
        <span class="cap">รหัสผ่านที่ได้</span>
        <div id="Plate" class="plate" aria-live="polite"><span class="placeholder">กด Start เพื่อเริ่ม</span></div>
        <div class="actions">
          <button id="StartButton" class="btn-start" type="button">Start</button>
          <button id="CopyButton" class="btn-copy" type="button">คัดลอก</button>
        </div>
        <div id="Warning" class="warning"></div>
      </section>
    </div>

    <div class="foot"><span>สุ่มด้วย crypto.getRandomValues</span><span>ไม่ถูกบันทึกหรือส่งไปไหน</span></div>
  </div>

  <script src="generator.js"></script>
  <script src="app.js"></script>
</body>
</html>
