<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Strength Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #0B1524;
    --panel: #101F35;
    --field: #17304F;
    --line: #24406A;
    --ink: #E8F0FB;
    --ink-dim: #8FA6C4;
    --signal: #5BE28A;
    --warn: #F2B23C;
    --danger: #FF5A5F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 460px;
    margin: 0 auto;
    padding: 56px 20px 40px;
  }

  .hero {
    text-align: center;
    margin-bottom: 28px;
  }

  .hero h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  .hero p {
    margin: 0;
    color: var(--ink-dim);
    font-size: 14px;
    line-height: 1.6;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.6);
  }

  .field {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--field);
    padding: 16px 12px 12px;
    margin-bottom: 32px;
  }

  .field-label {
    position: absolute;
    top: -9px;
    left: 14px;
    background: var(--panel);
    padding: 0 6px;
    font-size: 12px;
    color: var(--ink-dim);
  }

  .field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--signal);
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.02em;
  }

  .field input::placeholder {
    color: var(--ink-dim);
    font-family: "IBM Plex Sans Thai", sans-serif;
  }

  .field-toggle {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .field-toggle:hover {
    color: var(--ink);
    border-color: var(--ink-dim);
  }

  .topbar {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 24px;
    font-size: 13px;
  }

  .topbar-current {
    color: var(--ink-dim);
    font-weight: 600;
  }

  .topbar-link {
    color: var(--signal);
    font-weight: 600;
    text-decoration: none;
  }

  .topbar-link:hover {
    text-decoration: underline;
  }

  .gauge-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .gauge {
    width: 100%;
    max-width: 320px;
    height: auto;
  }

  .gauge .tick {
    stroke: var(--ink-dim);
    opacity: 0.5;
  }

  .gauge .tick-label {
    fill: var(--ink-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    text-anchor: middle;
  }

  .gauge .zone {
    fill: none;
    stroke-linecap: round;
  }

  .needle {
    transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  .needle line {
    stroke: var(--ink);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .needle circle {
    fill: var(--panel);
    stroke: var(--ink);
    stroke-width: 2;
  }

  @media (prefers-reduced-motion: reduce) {
    .needle { transition: none; }
  }

  .readout {
    margin-top: -18px;
    text-align: center;
  }

  .readout .bits {
    font-family: "IBM Plex Mono", monospace;
    font-size: 34px;
    font-weight: 600;
    line-height: 1.1;
  }

  .readout .bits-unit {
    font-size: 14px;
    color: var(--ink-dim);
    margin-left: 4px;
  }

  .readout .status {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 600;
  }

  .status--empty { color: var(--ink-dim); font-weight: 400; }
  .status--weak { color: var(--danger); }
  .status--medium { color: var(--warn); }
  .status--strong { color: var(--signal); }

  .no-store {
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 20px;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-top: 24px;
  }

  .chips-label {
    width: 100%;
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }

  .chip {
    background: var(--field);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }

  .chip:hover {
    color: var(--ink);
    border-color: var(--ink-dim);
  }

  input:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--signal);
    outline-offset: 2px;
  }
</style>
</head>
<body>
  <div class="page">
    <nav class="topbar">
      <span class="topbar-current">ตรวจสอบ</span>
      <a class="topbar-link" href="generator/">สุ่มรหัสผ่าน</a>
    </nav>

    <header class="hero">
      <h1>Password Strength Checker</h1>
      <p>พิมพ์รหัสผ่านเพื่อดูว่ามันเดายากแค่ไหนจริง ๆ — วัดจาก entropy จริง ไม่ใช่แค่นับความยาว</p>
    </header>

    <div class="panel">
      <div class="field">
        <span class="field-label">รหัสผ่านที่ต้องการทดสอบ</span>
        <input id="PasswordInput" type="text" autocomplete="off" spellcheck="false" placeholder="พิมพ์ตรงนี้ หรือไปสุ่มที่ด้านบน">
        <button id="CopyButton" class="field-toggle" type="button">คัดลอก</button>
        <button id="ToggleVisibility" class="field-toggle" type="button">ซ่อน</button>
      </div>

      <div class="gauge-wrap">
        <svg id="Gauge" class="gauge" viewBox="0 0 240 205"></svg>
        <div class="readout">
          <span id="BitsValue" class="bits">—</span><span class="bits-unit"></span>
          <div id="StatusLabel" class="status status--empty">พิมพ์รหัสผ่านเพื่อเริ่ม</div>
        </div>
      </div>

      <p class="no-store">ไม่ถูกบันทึกหรือส่งไปไหน — ประมวลผลใน JavaScript บนเครื่องคุณเท่านั้น</p>
    </div>

    <div class="chips">
      <span class="chips-label">ลองดู</span>
      <button class="chip" type="button" data-value="123456">123456</button>
      <button class="chip" type="button" data-value="qwertyuiop">qwertyuiop</button>
      <button class="chip" type="button" data-value="Tr0ub4dor&amp;3">Tr0ub4dor&3</button>
      <button class="chip" type="button" data-value="correct horse battery staple">correct horse battery staple</button>
    </div>
  </div>

  <script src="rules.js"></script>
  <script src="app.js"></script>
</body>
</html>
